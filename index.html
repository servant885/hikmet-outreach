<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hikmet Outreach</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f0f5f2;color:#16352b;margin:auto;max-width:900px;padding:24px}section,article{background:white;padding:20px;border-radius:16px;margin:16px 0;box-shadow:0 2px 12px #1231}input,textarea,button{font:inherit;padding:12px;border:1px solid #b8c9c0;border-radius:9px;margin:5px 0}input,textarea{width:100%}button{background:#17684e;color:white;cursor:pointer}button:disabled{opacity:.5}p{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#52665e}[hidden]{display:none!important}a{color:#17684e}#wizard a{display:inline-block;padding:10px;border:1px solid #b8c9c0;border-radius:8px}#wizard button{margin-left:8px}code{overflow-wrap:anywhere}</style><h1>Hikmet Outreach</h1><p>Hikmetle, güzel öğütle.</p><section id="setup"><h2>İlk kurulum</h2><p id="progress"></p><div id="wizard"></div><div id="fields"><label data-step="2">YouTube API anahtarı<input id="yt" type="password" autocomplete="off"></label><label data-step="4">Google OAuth Client ID<input id="client" autocomplete="off"></label></div><button id="back">Geri</button> <button id="forward">Devam</button><p id="setupmsg" role="status"></p><div id="connect" hidden><button id="login">Google hesabını bağla</button><button id="logout">Bağlantıyı kes</button><small id="auth"></small></div></section><section id="scanpanel" hidden><label>YouTube video bağlantısı<input id="url" placeholder="https://www.youtube.com/watch?v=..."></label><button id="scan">Tüm yorumları tara</button><button id="stop" disabled>Taramayı durdur</button><progress id="scanprogress" max="100" value="0" hidden style="width:100%;height:24px;accent-color:#17684e" aria-label="Yorum tarama ilerlemesi"></progress><p id="count" aria-live="polite"></p><label>Yapay zekâ ön değerlendirmesi<progress id="analysisprogress" max="1" value="0" style="width:100%;height:24px"></progress></label><p id="analysiscount" aria-live="polite"></p><p id="status" role="status"></p></section><section id="transfer" hidden><h2>ChatGPT ile analiz</h2><p>Her dosyayı ChatGPT’ye yükle. Talimat dosyanın içindedir. Dönen JSON dosyalarını buraya aktar.</p><div id="exports"></div><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT’yi aç ↗</a><p><label>Sonuç JSON dosyalarını seç<input id="imports" type="file" accept=".json,application/json" multiple></label></p><p id="importmsg" role="status"></p></section><main id="results"></main><script src="app.js"></script><script src="setup.js"></script></html>
