<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hikmet Outreach</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f0f5f2;color:#16352b;margin:auto;max-width:900px;padding:24px}section,article{background:white;padding:20px;border-radius:16px;margin:16px 0;box-shadow:0 2px 12px #1231}input,textarea,button{font:inherit;padding:12px;border:1px solid #b8c9c0;border-radius:9px;margin:5px 0}input,textarea{width:100%}button{background:#17684e;color:white;cursor:pointer}button:disabled{opacity:.5}p{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#52665e}</style><h1>Hikmet Outreach</h1><p>Hikmetle, güzel öğütle.</p><section><label>Google OAuth Client ID<input id="client"></label><label>YouTube API anahtarı<input id="yt" type="password"></label><label>Gemini API anahtarı<input id="gem" type="password"></label><label>Gemini model adı<input id="model" value="gemini-2.5-flash"></label><button id="login">Google hesabını bağla</button><button id="logout">Bağlantıyı kes</button><small id="auth"></small></section><section><label>YouTube video bağlantısı<input id="url" placeholder="https://www.youtube.com/watch?v=..."></label><button id="scan">Yorumları getir</button><button id="more" disabled>Sonraki 100 yorum</button><p id="status" role="status"></p></section><main id="results"></main><script src="app.js"></script></html>
